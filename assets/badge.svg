<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Эмблема ЭЛЕМЕНТ">
  <title>ЭЛЕМЕНТ</title>
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D69C66"/>
      <stop offset="0.5" stop-color="#B87333"/>
      <stop offset="1" stop-color="#8A4F22"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#20262F"/>
      <stop offset="1" stop-color="#0E1116"/>
    </radialGradient>
  </defs>
  <!-- outer hexagon -->
  <polygon points="256,28 454,142 454,370 256,484 58,370 58,142"
           fill="url(#core)" stroke="url(#copper)" stroke-width="14" stroke-linejoin="round"/>
  <!-- inner hexagon hairline -->
  <polygon points="256,74 414,165 414,347 256,438 98,347 98,165"
           fill="none" stroke="#B87333" stroke-opacity="0.35" stroke-width="3"/>
  <!-- stylised Cyrillic "Э" -->
  <g fill="#F8F9FA">
    <rect x="172" y="168" width="148" height="26" rx="8"/>
    <rect x="172" y="243" width="148" height="26" rx="8" fill="#D69C66"/>
    <rect x="172" y="318" width="148" height="26" rx="8"/>
    <rect x="296" y="168" width="24" height="176" rx="8"/>
  </g>
</svg>
