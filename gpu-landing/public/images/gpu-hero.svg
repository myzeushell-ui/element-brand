<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Газопоршневая установка ЭЛЕМЕНТ — вид сбоку с габаритными размерами">
  <defs>
    <linearGradient id="eng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6FC4"/><stop offset="1" stop-color="#1B4F94"/>
    </linearGradient>
    <linearGradient id="engDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22579E"/><stop offset="1" stop-color="#143C74"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEFF2"/><stop offset="0.5" stop-color="#C6CBD2"/><stop offset="1" stop-color="#9AA0A8"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B7BCC4"/><stop offset="0.5" stop-color="#E7EAEE"/><stop offset="1" stop-color="#AAB0B8"/>
    </linearGradient>
    <linearGradient id="blk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30343B"/><stop offset="1" stop-color="#16191E"/>
    </linearGradient>
    <linearGradient id="skid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262A31"/><stop offset="1" stop-color="#111418"/>
    </linearGradient>
    <radialGradient id="fan" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3A3F47"/><stop offset="1" stop-color="#181B20"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#E7EBF1" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- лёгкая инженерная сетка на фоне -->
  <rect x="470" y="40" width="560" height="560" fill="url(#grid)" opacity="0.9"/>

  <!-- контактная тень -->
  <ellipse cx="500" cy="588" rx="430" ry="20" fill="#0E1116" opacity="0.08"/>

  <!-- рама / скид -->
  <rect x="70" y="516" width="812" height="60" rx="6" fill="url(#skid)"/>
  <rect x="70" y="516" width="812" height="5" rx="2.5" fill="#1E5AA8"/>
  <rect x="150" y="576" width="70" height="16" rx="3" fill="#0E1116"/>
  <rect x="470" y="576" width="70" height="16" rx="3" fill="#0E1116"/>
  <rect x="740" y="576" width="70" height="16" rx="3" fill="#0E1116"/>

  <!-- генератор (серебристый цилиндр, слева) -->
  <ellipse cx="150" cy="430" rx="20" ry="74" fill="#AEB4BC"/>
  <rect x="150" y="356" width="190" height="148" rx="12" fill="url(#steel)" stroke="#8E949C"/>
  <ellipse cx="340" cy="430" rx="16" ry="74" fill="#D7DBE0" stroke="#9197A0"/>
  <rect x="176" y="360" width="6" height="140" rx="3" fill="#8A9099" opacity="0.6"/>
  <rect x="198" y="360" width="6" height="140" rx="3" fill="#8A9099" opacity="0.6"/>
  <rect x="220" y="360" width="6" height="140" rx="3" fill="#8A9099" opacity="0.6"/>
  <rect x="242" y="360" width="6" height="140" rx="3" fill="#8A9099" opacity="0.6"/>
  <rect x="264" y="360" width="6" height="140" rx="3" fill="#8A9099" opacity="0.6"/>
  <rect x="286" y="360" width="6" height="140" rx="3" fill="#8A9099" opacity="0.6"/>
  <rect x="308" y="360" width="6" height="140" rx="3" fill="#8A9099" opacity="0.6"/>

  <!-- муфта / кожух -->
  <rect x="352" y="374" width="42" height="120" rx="8" fill="url(#blk)"/>

  <!-- двигатель (синий блок, центр) -->
  <rect x="392" y="330" width="250" height="180" rx="10" fill="url(#eng)" stroke="#143C74"/>
  <!-- клапанные крышки -->
  <rect x="404" y="300" width="220" height="40" rx="8" fill="url(#engDark)" stroke="#123368"/>
  <g fill="#3E7AC4">
    <rect x="416" y="308" width="26" height="24" rx="3"/>
    <rect x="452" y="308" width="26" height="24" rx="3"/>
    <rect x="488" y="308" width="26" height="24" rx="3"/>
    <rect x="524" y="308" width="26" height="24" rx="3"/>
    <rect x="560" y="308" width="26" height="24" rx="3"/>
    <rect x="596" y="308" width="14" height="24" rx="3"/>
  </g>
  <!-- рёбра блока -->
  <g stroke="#153F79" stroke-width="2" opacity="0.55">
    <line x1="392" y1="372" x2="642" y2="372"/>
    <line x1="392" y1="416" x2="642" y2="416"/>
    <line x1="392" y1="460" x2="642" y2="460"/>
  </g>
  <!-- воздушный фильтр (цилиндр сверху) -->
  <rect x="560" y="250" width="96" height="46" rx="20" fill="url(#blk)"/>
  <ellipse cx="560" cy="273" rx="10" ry="23" fill="#22252B"/>

  <!-- стальные выхлопные / впускные патрубки -->
  <path d="M470 300 q0 -46 44 -46 h30" fill="none" stroke="url(#steel2)" stroke-width="16" stroke-linecap="round"/>
  <path d="M628 330 q40 -6 44 -60" fill="none" stroke="url(#steel2)" stroke-width="14" stroke-linecap="round"/>
  <path d="M628 360 q54 0 70 40" fill="none" stroke="url(#steel2)" stroke-width="12" stroke-linecap="round"/>

  <!-- радиатор + два вентилятора (чёрная рама справа) -->
  <rect x="656" y="322" width="150" height="190" rx="10" fill="url(#blk)" stroke="#0E1116"/>
  <g>
    <circle cx="731" cy="380" r="44" fill="url(#fan)" stroke="#0E1116"/>
    <circle cx="731" cy="380" r="10" fill="#4A505A"/>
    <g stroke="#5A616B" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="731" y1="380" x2="731" y2="340"/>
      <line x1="731" y1="380" x2="766" y2="360"/>
      <line x1="731" y1="380" x2="766" y2="400"/>
      <line x1="731" y1="380" x2="731" y2="420"/>
      <line x1="731" y1="380" x2="696" y2="400"/>
      <line x1="731" y1="380" x2="696" y2="360"/>
    </g>
  </g>
  <g>
    <circle cx="731" cy="466" r="34" fill="url(#fan)" stroke="#0E1116"/>
    <circle cx="731" cy="466" r="8" fill="#4A505A"/>
    <g stroke="#5A616B" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="731" y1="466" x2="731" y2="436"/>
      <line x1="731" y1="466" x2="758" y2="452"/>
      <line x1="731" y1="466" x2="758" y2="480"/>
      <line x1="731" y1="466" x2="704" y2="480"/>
      <line x1="731" y1="466" x2="704" y2="452"/>
    </g>
  </g>

  <!-- шкаф управления (высокий, справа) -->
  <rect x="800" y="250" width="82" height="266" rx="8" fill="url(#blk)" stroke="#0E1116"/>
  <!-- экран -->
  <rect x="814" y="268" width="54" height="40" rx="4" fill="#0C1622"/>
  <rect x="819" y="274" width="30" height="6" rx="2" fill="#2E6FC4"/>
  <rect x="819" y="285" width="44" height="4" rx="2" fill="#1E5AA8" opacity="0.7"/>
  <rect x="819" y="293" width="24" height="4" rx="2" fill="#3E7AC4" opacity="0.6"/>
  <!-- круглый прибор -->
  <circle cx="841" cy="342" r="16" fill="#0E1116" stroke="#3A3F47"/>
  <path d="M841 342 L850 334" stroke="#3E7AC4" stroke-width="2" stroke-linecap="round"/>
  <!-- кнопки/индикаторы -->
  <circle cx="822" cy="378" r="4.5" fill="#D64541"/>
  <circle cx="841" cy="378" r="4.5" fill="#3DBE6B"/>
  <circle cx="860" cy="378" r="4.5" fill="#2E6FC4"/>
  <!-- жалюзи снизу -->
  <g stroke="#3A3F47" stroke-width="3">
    <line x1="814" y1="404" x2="868" y2="404"/>
    <line x1="814" y1="414" x2="868" y2="414"/>
    <line x1="814" y1="424" x2="868" y2="424"/>
    <line x1="814" y1="434" x2="868" y2="434"/>
    <line x1="814" y1="444" x2="868" y2="444"/>
    <line x1="814" y1="454" x2="868" y2="454"/>
  </g>

  <!-- ГАБАРИТНЫЕ РАЗМЕРЫ -->
  <g stroke="#B4BBC5" stroke-width="1.5" fill="none">
    <!-- высота 1950 -->
    <line x1="916" y1="250" x2="916" y2="576"/>
    <line x1="910" y1="250" x2="922" y2="250"/>
    <line x1="910" y1="576" x2="922" y2="576"/>
    <!-- ширина 3200 -->
    <line x1="70" y1="620" x2="806" y2="620"/>
    <line x1="70" y1="614" x2="70" y2="626"/>
    <line x1="806" y1="614" x2="806" y2="626"/>
    <!-- глубина 900 (в перспективе) -->
    <line x1="806" y1="620" x2="882" y2="652"/>
    <line x1="878" y1="640" x2="886" y2="664"/>
  </g>
  <g fill="#8A929C" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">
    <text x="932" y="418" transform="rotate(90 932 418)" text-anchor="middle">1950 мм</text>
    <text x="438" y="644" text-anchor="middle">3200 мм</text>
    <text x="866" y="678" text-anchor="middle">900 мм</text>
  </g>
</svg>
